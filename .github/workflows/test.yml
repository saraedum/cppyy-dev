name: Test
on: push

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cppyy-cling:
    runs-on: "${{ matrix.on }}"
    strategy:
      fail-fast: false
      matrix:
        environment: ["cppyy-cling-dev-builtin-llvm", "cppyy-cling-dev-conda-forge-llvm"]
        task: ["install-cppyy-cling-from-patched", "install-cppyy-cling-from-upstream"]
        on: ["ubuntu-24.04", "macos-13", "macos-14"]
        exclude:
        # We cannot build an unpatched cppyy-cling against our clang due to the misordering of static clang dependencies when linking
        - environment: cppyy-cling-dev-conda-forge-llvm
          task: install-cppyy-cling-from-upstream
        # We cannot build an unpatched cppyy-cling on macos-14 due to RTTI being incorrect for InterpreterCallback.cpp
        - task: install-cppyy-cling-from-upstream
          on: macos-13
        # We cannot build an unpatched cppyy-cling on macos-14 due to RTTI being incorrect for InterpreterCallback.cpp
        - task: install-cppyy-cling-from-upstream
          on: macos-14
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - uses: prefix-dev/setup-pixi@v0.9.3
      with:
        pixi-version: v0.59.0
        environments: ${{ matrix.environment }}
        activate-environment: true
    - name: Run install task
      run: VERBOSE=1 pixi run ${{ matrix.task }}
    - uses: flatsurf/actions/show-logs@main
      if: ${{ always() }}
  cppyy-backend:
    runs-on: "${{ matrix.on }}"
    strategy:
      fail-fast: false
      matrix:
        environment: ["cppyy-backend-dev-conda-forge", "cppyy-backend-dev-pypi"]
        task: ["install-cppyy-backend-from-patched", "install-cppyy-backend-from-upstream"]
        on: ["ubuntu-24.04", "macos-13", "macos-14"]
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - uses: prefix-dev/setup-pixi@v0.9.3
      with:
        pixi-version: v0.59.0
        environments: ${{ matrix.environment }}
        activate-environment: true
    - name: Run install task
      run: VERBOSE=1 pixi run ${{ matrix.task }}
    - uses: flatsurf/actions/show-logs@main
      if: ${{ always() }}
  cpycppyy:
    runs-on: "${{ matrix.on }}"
    strategy:
      fail-fast: false
      matrix:
        environment: ["cpycppyy-dev-conda-forge", "cpycppyy-dev-pypi"]
        task: ["install-cpycppyy-from-patched", "install-cpycppyy-from-upstream"]
        on: ["ubuntu-24.04", "macos-13", "macos-14"]
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - uses: prefix-dev/setup-pixi@v0.9.3
      with:
        pixi-version: v0.59.0
        environments: ${{ matrix.environment }}
        activate-environment: true
    - name: Run install task
      run: VERBOSE=1 pixi run ${{ matrix.task }}
    - uses: flatsurf/actions/show-logs@main
      if: ${{ always() }}
  cppyy:
    runs-on: "${{ matrix.on }}"
    strategy:
      fail-fast: false
      matrix:
        environment: ["cppyy-dev-conda-forge", "cppyy-dev-pypi", "cppyy-pypi", "cppyy-conda-forge", "dev-builtin-llvm", "dev-conda-forge-llvm"]
        on: ["ubuntu-24.04", "macos-13", "macos-14"]
        include:
          - environment: cppyy-dev-conda-forge
            installation: install-cppyy-from-patched
          - environment: cppyy-dev-pypi
            installation: install-cppyy-from-patched
          - environment: dev-builtin-llvm
            installation: install
          - environment: dev-conda-forge-llvm
            installation: install
        exclude:
          # cppyy on PyPI vendors a very old clang that is incompatible with any libcxx that would be compatible with the relevant packages that we need from conda-forge.
          - environment: cppyy-pypi
            on: macos-13
          # cppyy on PyPI vendors a very old clang that is incompatible with any libcxx that would be compatible with the relevant packages that we need from conda-forge.
          - environment: cppyy-pypi
            on: macos-14
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - uses: prefix-dev/setup-pixi@v0.9.3
      with:
        pixi-version: v0.59.0
        environments: ${{ matrix.environment }}
        activate-environment: true
    - name: Pin installed cppyy
      run: mamba list --json |  jq -r '.[] | select(.name=="cppyy") | "\(.name) ==\(.version)"' > $CONDA_PREFIX/conda-meta/pinned
      if: ${{ matrix.environment == 'cppyy-conda-forge' }}
    - name: Run install task
      run: VERBOSE=1 pixi run ${{ matrix.installation }}
      if: ${{ matrix.installation }}
    - name: Run cppyy test suite
      id: test-cppyy
      run: pixi run test
      continue-on-error: true
    - name: Prepare for downstream tests
      uses: nick-fields/retry@v3
      with:
        # Retry mamba install since sometimes we get network timeouts in CI here.
        max_attempts: 5
        timeout_minutes: 15
        retry_on: error
        command: pixi run install-flatsurf-suite-dependencies
    - name: Run cppyythonizations test suite
      id: test-cppyythonizations
      run: pixi run test-cppyythonizations
      continue-on-error: true
    - name: Install cppyythonizations for later tests
      run: pixi run install-cppyythonizations
    - name: Run gmpxxyy test suite
      id: test-gmpxxyy
      run: pixi run test-gmpxxyy
      continue-on-error: true
    - name: Install gmpxxyy for later tests
      run: pixi run install-gmpxxyy
    - name: Run e-antic test suite
      id: test-e-antic
      run: pixi run test-e-antic
      continue-on-error: true
    - name: Install e-antic for later tests
      run: pixi run install-e-antic
    - name: Run exact-real test suite
      id: test-exact-real
      run: pixi run test-exact-real
      continue-on-error: true
    - name: Install exact-real for later tests
      run: pixi run install-exact-real
    - name: Run intervalxt test suite
      id: test-intervalxt
      run: pixi run test-intervalxt
      continue-on-error: true
    - name: Install intervalxt for later tests
      run: pixi run install-intervalxt
    - name: Run flatsurf test suite
      id: test-flatsurf
      run: pixi run test-flatsurf
      continue-on-error: true
    - name: Install flatsurf for later tests
      run: pixi run install-flatsurf
    - name: Run sage-flatsurf test suite
      id: test-sage-flatsurf
      run: pixi run test-sage-flatsurf
      continue-on-error: true
    - name: Fail job if any downstream tests failed
      if: ${{ always() }}
      run: |
        failed=0

        expected_outcome() {
          label="$1"
          expected="success"
          case "$label" in
            "cppyy test suite")
              # Currently, test fails for a variety of reasons on all builds of cppyy, see pixi.toml
              expected="failure"
              ;;
            "e-antic test suite")
              # Known errors:
              # * CPyCppyy headers are installed into cpycppyy/ by modern setuptools instead of CPyCppyy/ so lots of warnings and errors during testing, see https://github.com/wlav/cppyy/issues/292
              if [[ "${{ matrix.environment }}" =~ ^cppyy-(dev-)?pypi$ ]]; then
                expected="failure"
              fi
              ;;
            "exact-real test suite")
              # Known errors:
              # * CPyCppyy headers are installed into cpycppyy/ by modern setuptools instead of CPyCppyy/ so lots of warnings and errors during testing, see https://github.com/wlav/cppyy/issues/292
              if [[ "${{ matrix.environment }}" =~ ^cppyy-(dev-)?pypi$ ]]; then
                expected="failure"
              fi
              ;;
            "flatsurf test suite")
              # Known errors:
              # * CPyCppyy headers are installed into cpycppyy/ by modern setuptools instead of CPyCppyy/ so lots of warnings and errors during testing, see https://github.com/wlav/cppyy/issues/292
              if [[ "${{ matrix.environment }}" =~ ^cppyy-(dev-)?pypi$ ]]; then
                expected="failure"
              fi
              ;;
            "sage-flatsurf test suite")
              # Known errors:
              # * CPyCppyy headers are installed into cpycppyy/ by modern setuptools instead of CPyCppyy/ so lots of warnings and errors during testing, see https://github.com/wlav/cppyy/issues/292
              if [[ "${{ matrix.environment }}" =~ ^cppyy-(dev-)?pypi$ ]]; then
                expected="failure"
              fi
              ;;
          esac
          echo "$expected"
        }

        check() {
          label="$1"
          outcome="$2"
          expected=$(expected_outcome "$label")

          if [ "$outcome" = "skipped" ]; then
            return
          elif [ "$outcome" != "$expected" ]; then
            echo "::error title=${label}::${label} ${outcome} (expected ${expected})"
            failed=1
          elif [ "$outcome" = "failure" ]; then
            echo "::warning title=${label}::${label} failed as expected"
          fi
        }

        check "cppyy test suite" "${{ steps.test-cppyy.outcome }}"
        check "cppyythonizations test suite" "${{ steps.test-cppyythonizations.outcome }}"
        check "gmpxxyy test suite" "${{ steps.test-gmpxxyy.outcome }}"
        check "e-antic test suite" "${{ steps.test-e-antic.outcome }}"
        check "exact-real test suite" "${{ steps.test-exact-real.outcome }}"
        check "intervalxt test suite" "${{ steps.test-intervalxt.outcome }}"
        check "flatsurf test suite" "${{ steps.test-flatsurf.outcome }}"
        check "sage-flatsurf test suite" "${{ steps.test-sage-flatsurf.outcome }}"

        if [ "$failed" -ne 0 ]; then
          exit 1
        fi
    - uses: flatsurf/actions/show-logs@main
      if: ${{ always() }}
