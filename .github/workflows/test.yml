name: Test
on: push

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cppyy-cling:
    runs-on: "${{ matrix.on }}"
    strategy:
      fail-fast: false
      matrix:
        environment: ["cppyy-cling-dev-builtin-llvm", "cppyy-cling-dev-conda-forge-llvm"]
        task: ["install-cppyy-cling-from-patched", "install-cppyy-cling-from-upstream"]
        on: ["ubuntu-24.04", "macos-13", "macos-14"]
        exclude:
        # We cannot build an unpatched cppyy-cling against our clang due to the misordering of static clang dependencies when linking
        - environment: cppyy-cling-dev-conda-forge-llvm
          task: install-cppyy-cling-from-upstream
        # We cannot build an unpatched cppyy-cling on macos-14 due to RTTI being incorrect for InterpreterCallback.cpp
        - task: install-cppyy-cling-from-upstream
          on: macos-13
        # We cannot build an unpatched cppyy-cling on macos-14 due to RTTI being incorrect for InterpreterCallback.cpp
        - task: install-cppyy-cling-from-upstream
          on: macos-14
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - uses: prefix-dev/setup-pixi@v0.9.3
      with:
        pixi-version: v0.59.0
        environments: ${{ matrix.environment }}
        activate-environment: true
    - name: Run install task
      run: VERBOSE=1 pixi run ${{ matrix.task }}
    - uses: flatsurf/actions/show-logs@main
      if: ${{ always() }}
  cppyy-backend:
    runs-on: "${{ matrix.on }}"
    strategy:
      fail-fast: false
      matrix:
        environment: ["cppyy-backend-dev-conda-forge", "cppyy-backend-dev-pypi"]
        task: ["install-cppyy-backend-from-patched", "install-cppyy-backend-from-upstream"]
        on: ["ubuntu-24.04", "macos-13", "macos-14"]
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - uses: prefix-dev/setup-pixi@v0.9.3
      with:
        pixi-version: v0.59.0
        environments: ${{ matrix.environment }}
        activate-environment: true
    - name: Run install task
      run: VERBOSE=1 pixi run ${{ matrix.task }}
    - uses: flatsurf/actions/show-logs@main
      if: ${{ always() }}
  cpycppyy:
    runs-on: "${{ matrix.on }}"
    strategy:
      fail-fast: false
      matrix:
        environment: ["cpycppyy-dev-conda-forge", "cpycppyy-dev-pypi"]
        task: ["install-cpycppyy-from-patched", "install-cpycppyy-from-upstream"]
        on: ["ubuntu-24.04", "macos-13", "macos-14"]
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - uses: prefix-dev/setup-pixi@v0.9.3
      with:
        pixi-version: v0.59.0
        environments: ${{ matrix.environment }}
        activate-environment: true
    - name: Run install task
      run: VERBOSE=1 pixi run ${{ matrix.task }}
    - uses: flatsurf/actions/show-logs@main
      if: ${{ always() }}
  cppyy:
    runs-on: "${{ matrix.on }}"
    strategy:
      fail-fast: false
      matrix:
        environment: ["cppyy-dev-conda-forge", "cppyy-dev-pypi", "cppyy-pypi", "cppyy-conda-forge"]
        on: ["ubuntu-24.04", "macos-13", "macos-14"]
        include:
          - environment: cppyy-dev-conda-forge
            installation: install-cppyy-from-patched
          - environment: cppyy-dev-pypi
            installation: install-cppyy-from-patched
        exclude:
          # cppyy on PyPI vendors a very old clang that is incompatible with any libcxx that would be compatible with the relevant packages that we need from conda-forge.
          - environment: cppyy-pypi
            on: macos-13
          # cppyy on PyPI vendors a very old clang that is incompatible with any libcxx that would be compatible with the relevant packages that we need from conda-forge.
          - environment: cppyy-pypi
            on: macos-14
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - uses: prefix-dev/setup-pixi@v0.9.3
      with:
        pixi-version: v0.59.0
        environments: ${{ matrix.environment }}
        activate-environment: true
    - name: Pin installed cppyy
      run: mamba list --json |  jq -r '.[] | select(.name=="cppyy") | "\(.name) ==\(.version)"' > $CONDA_PREFIX/conda-meta/pinned
      if: ${{ matrix.environment == 'cppyy-conda-forge' }}
    - name: Run install task
      run: VERBOSE=1 pixi run ${{ matrix.installation }}
      if: ${{ matrix.installation }}
    - name: Run cppyy test suite
      # Currently, test fails for a variety of reasons on all builds of cppyy, see pixi.toml
      run: pixi run test || true
    - name: Prepare for downstream tests
      run: pixi run install-flatsurf-suite-dependencies
    # Known errors:
    # * cppyy-{dev-,}conda-forge/ubuntu-24.04 fails in the pickling tests with:
    #   ```
    #   AttributeError: 'vector<int>' object has no attribute 'to_json'
    #   ```
    - name: Run cppyythonizations test suite
      run: pixi run test-cppyythonizations
      continue-on-error: true
    - name: Install cppyythonizations for later tests
      run: pixi run install-cppyythonizations
    - name: Run gmpxxyy test suite
      run: pixi run test-gmpxxyy
      continue-on-error: true
    - name: Install gmpxxyy for later tests
      run: pixi run install-gmpxxyy
    # Known errors:
    # * cppyy-{dev-,}pypi/ubuntu-24.04 fails to convert a `lambda prec: str(something)` to the `std::function` below.
    #   ```
    #   static boost::intrusive_ptr<const eantic::renf_class> eantic::renf_class::make(const std::string& minpoly, const std::string& gen, const std::function<std::string(long)> emb, slong prec = 64) =>
    #   TypeError: could not convert argument 3
    #   ```
    - name: Run e-antic test suite
      run: pixi run test-e-antic
      continue-on-error: true
    - name: Install e-antic for later tests
      run: pixi run install-e-antic
    # Known errors:
    # * cppyy-{dev-,}pypi/ubuntu-24.04 fails to convert a `lambda prec: str(something)` to the `std::function` below.
    #   ```
    #   static boost::intrusive_ptr<const eantic::renf_class> eantic::renf_class::make(const std::string& minpoly, const std::string& gen, const std::function<std::string(long)> emb, slong prec = 64) =>
    #   TypeError: could not convert argument 3
    #   ```
    # * cppyy-dev-pypi/macos-14 fails to find a symbol (probably due to different symbol mangling of enable_if)
    #   ```
    #   IncrementalExecutor::executeFunction: symbol '_ZN9exactreal7ElementINS_11NumberFieldEEmLILb1ELb1EEERS2_RKN6eantic15renf_elem_classE' unresolved while linking symbol '__cf_40'!
    #   You are probably missing the definition of exactreal::Element<exactreal::NumberField>& exactreal::Element<exactreal::NumberField>::operator*=<true, true>(eantic::renf_elem_class const&)
    #   ```
    - name: Run exact-real test suite
      run: pixi run test-exact-real
      continue-on-error: true
    - name: Install exact-real for later tests
      run: pixi run install-exact-real
    - name: Run intervalxt test suite
      run: pixi run test-intervalxt
      continue-on-error: true
    - name: Install intervalxt for later tests
      run: pixi run install-intervalxt
    - name: Run flatsurf test suite
      run: pixi run test-flatsurf
      continue-on-error: true
    - name: Install flatsurf for later tests
      run: pixi run install-flatsurf
    - name: Run sage-flatsurf test suite
      run: pixi run test-sage-flatsurf
      continue-on-error: true
    - uses: flatsurf/actions/show-logs@main
      if: ${{ always() }}
