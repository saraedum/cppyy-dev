[workspace]
channels = ["conda-forge"]
name = "cppyy"
platforms = ["linux-64", "osx-64", "osx-arm64"]
version = "6.30.0"

[environments]
feedstock-dev = ["feedstock-dev"]

cppyy-cling-dev-builtin-llvm = ["cppyy-cling-dev", "cppyy-cling-dev-builtin-llvm", "builtin-llvm"]
cppyy-cling-dev-conda-forge-llvm = ["cppyy-cling-dev", "cppyy-cling-dev-conda-forge-llvm", "conda-forge-llvm"]

# TODO: Make these environments available, see README.md
# cppyy-backend-dev-local-builtin-llvm = [?]
# cppyy-backend-dev-local-conda-forge-llvm = [?]
cppyy-backend-dev-conda-forge = ["cppyy-backend-dev", "cppyy-backend-dev-conda-forge", "cppyy-cling-conda-forge"]
cppyy-backend-dev-pypi = ["cppyy-backend-dev", "cppyy-backend-dev-pypi", "cppyy-cling-pypi"]

# TODO: Make these environments available, see README.md
# cpycppyy-dev-local-builtin-llvm = [?]
# cpycppyy-dev-local-conda-forge-llvm = [?]
cpycppyy-dev-conda-forge = ["cpycppyy-dev", "cpycppyy-dev-conda-forge", "cppyy-cling-conda-forge", "cppyy-backend-conda-forge"]
cpycppyy-dev-pypi = ["cpycppyy-dev", "cpycppyy-dev-pypi", "cppyy-cling-pypi", "cppyy-backend-pypi"]

# TODO: Make these environments available, see README.md
# cppyy-dev-local-builtin-llvm = [?]
# cppyy-dev-local-conda-forge-llvm = [?]
cppyy-dev-conda-forge = ["cppyy-dev", "cppyy-dev-conda-forge", "cppyy-cling-conda-forge", "cppyy-backend-conda-forge", "cpycppyy-conda-forge"]
cppyy-dev-pypi = ["cppyy-dev", "cppyy-dev-pypi", "cppyy-cling-pypi", "cppyy-backend-pypi", "cpycppyy-pypi"]

cppyy-pypi = ["cppyy-dev", "cppyy-pypi"]
cppyy-conda-forge = ["cppyy-dev", "cppyy-conda-forge"]

################
# DEPENDENCIES #
################
[dependencies]
pip = "*"
setuptools = "*"
cxx-compiler = "*"
ccache = "*"

[feature.feedstock-dev.dependencies]
conda-build = "*"
conda-smithy = "*"
conda-recipe-manager = "*"

[feature.cppyy-cling-dev.dependencies]
cmake = "*"
findutils = "*"
libboost-headers = "*"
libxml2 = "*"
make = "*"
pip = "*"
python = "*"
sed = "*"
setuptools = "*"
zlib = "*"

[feature.builtin-llvm.dependencies]

[feature.conda-forge-llvm.dependencies]
clangdev = { version="13.*", build="root_63004*" }

[feature.cppyy-cling-conda-forge.dependencies]
cppyy-cling = "==6.30.0"

[feature.cppyy-backend-conda-forge.dependencies]
cppyy-backend = "==1.15.2"

[feature.cpycppyy-conda-forge.dependencies]
cpycppyy = "==1.12.16"

[feature.cppyy-conda-forge.dependencies]
cppyy = "==3.1.2"

[feature.cppyy-cling-pypi.pypi-dependencies]
cppyy-cling = "==6.30.0"

[feature.cppyy-backend-pypi.pypi-dependencies]
cppyy-backend = "==1.15.2"

[feature.cpycppyy-pypi.pypi-dependencies]
cpycppyy = "==1.12.16"

[feature.cppyy-pypi.pypi-dependencies]
cppyy = "==3.1.2"

[feature.cppyy-dev.dependencies]
pytest = "*"
make = "*"

[feature.cppyy-pypi.target.linux-64.dependencies]
# Clang 13 which cppyy 3.1.2 is based upon cannot parse GCC 12 headers, see https://github.com/wlav/cppyy/issues/285
gcc = "11.*"

#########
# TASKS #
#########
[feature.cppyy-cling-dev.tasks.create-src-directory]
cmd = "create_src_directory.py"
cwd = "upstream/cppyy-backend/cling"

[feature.cppyy-cling-dev.tasks.configure-cppyy-cling-patched-builtin-llvm]
# runtime_cxxmodules (whatever that might be) leads to "error: unknown argument: '-fmodule-name'" during the build
cmd = "mkdir -p build && cd build && cmake ../src -Dbuiltin_llvm=ON -Dbuiltin_clang=ON -DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX -Dbuiltin_cling=ON -Druntime_cxxmodules=OFF -DCMAKE_CXX_STANDARD=17"
cwd = "patched/cppyy-cling"

[feature.cppyy-cling-dev.tasks.configure-cppyy-cling-patched-conda-forge-llvm]
# runtime_cxxmodules (whatever that might be) leads to "error: unknown argument: '-fmodule-name'" during the build
cmd = "mkdir -p build && cd build && cmake ../src -Dbuiltin_llvm=OFF -Dbuiltin_clang=OFF -DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX -Dbuiltin_cling=ON -Druntime_cxxmodules=OFF -DCMAKE_CXX_STANDARD=17"
cwd = "patched/cppyy-cling"

[feature.cppyy-cling-dev.tasks.configure-cppyy-cling-upstream-builtin-llvm]
cmd = "TODO"
cwd = "upstream/cppyy-backend/cling"

[feature.cppyy-cling-dev.tasks.configure-cppyy-cling-upstream-conda-forge-llvm]
cmd = "TODO"
cwd = "upstream/cppyy-backend/cling"

[feature.cppyy-cling-dev.tasks.build-cppyy-cling-patched]
cmd = "cd build && make"
cwd = "patched/cppyy-cling"

[feature.cppyy-cling-dev.tasks.build-cppyy-cling-upstream]
cmd = "TODO"
cwd = "upstream/cppyy-backend/cling"

[feature.cppyy-cling-dev.tasks.install-cppyy-cling-patched]
cmd = "python setup.py install --skip-build"
cwd = "patched/cppyy-cling"

[feature.cppyy-cling-dev.tasks.install-cppyy-cling-upstream]
cmd = "python setup.py install --skip-build"
cwd = "upstream/cppyy-backend/cling"

[feature.cppyy-cling-dev-builtin-llvm.tasks.install-cppyy-cling-from-patched]
depends-on = ["configure-cppyy-cling-patched-builtin-llvm", "build-cppyy-cling-patched", "install-cppyy-cling-patched"]

[feature.cppyy-cling-dev-conda-forge-llvm.tasks.install-cppyy-cling-from-patched]
depends-on = ["configure-cppyy-cling-patched-conda-forge-llvm", "build-cppyy-cling-patched", "install-cppyy-cling-patched"]

[feature.cppyy-cling-dev-builtin-llvm.tasks.install-cppyy-cling-from-upstream]
depends-on = ["create-src-directory", "configure-cppyy-cling-upstream-builtin-llvm", "build-cppyy-cling-upstream", "install-cppyy-cling-upstream"]

[feature.cppyy-cling-dev-conda-forge-llvm.tasks.install-cppyy-cling-from-upstream]
depends-on = ["create-src-directory", "configure-cppyy-cling-upstream-conda-forge-llvm", "build-cppyy-cling-upstream", "install-cppyy-cling-upstream"]

[feature.cppyy-cling-dev-builtin-llvm.tasks.install]
depends-on = ["install-cppyy-cling-from-patched"]

[feature.cppyy-cling-dev-conda-forge-llvm.tasks.install]
depends-on = ["install-cppyy-cling-from-patched"]

[feature.cppyy-backend-dev.tasks.install-cppyy-backend-from-pypi]
cmd = "pip install --no-deps --no-build-isolation -v --force-reinstall cppyy-backend==1.15.2"

[feature.cppyy-backend-dev.tasks.install-cppyy-backend-from-patched]
cmd = "pip install --no-deps --no-build-isolation -vv ."
cwd = "patched/cppyy-backend"

[feature.cppyy-backend-dev.tasks.install-cppyy-backend-from-upstream]
cmd = "pip install --no-deps --no-build-isolation -vv ."
cwd = "upstream/cppyy-backend/clingwrapper"

[feature.cppyy-backend-dev-conda-forge.tasks.install]
depends-on = ["install-cppyy-backend-from-patched"]

[feature.cppyy-backend-dev-pypi.tasks.install]
depends-on = ["install-cppyy-backend-from-patched"]

[feature.cpycppyy-dev.tasks.install-cpycppyy-from-pypi]
cmd = "pip install --no-deps --no-build-isolation -v --force-reinstall cpycppyy==1.12.16"

[feature.cpycppyy-dev.tasks.install-cpycppyy-from-patched]
cmd = "pip install --no-deps --no-build-isolation -vv ."
cwd = "patched/cpycppyy"

[feature.cpycppyy-dev.tasks.install-cpycppyy-from-upstream]
cmd = "pip install --no-deps --no-build-isolation -vv ."
cwd = "upstream/cpycppyy"

[feature.cpycppyy-dev-conda-forge.tasks.install]
depends-on = ["install-cpycppyy-from-patched"]

[feature.cpycppyy-dev-pypi.tasks.install]
depends-on = ["install-cpycppyy-from-patched"]

[feature.cppyy-dev.tasks.test]
# TODO: Tests do not pass:
# In cppyy-pypi, we get stltypes.cxx:18:59: error: 'operator!=' is not a template function
# In cppyy-conda-forge (and all other setups) we get a segfault.
# I should report this upstream and find out how to make this pass.
cmd = "make clean && make && make test"
cwd = "upstream/cppyy/test"

[feature.cppyy-dev.tasks.install-cppyy-from-pypi]
cmd = "pip install --no-deps --no-build-isolation -v --force-reinstall cppyy==3.1.2"

[feature.cppyy-dev.tasks.install-cppyy-from-patched]
cmd = "pip install --no-deps --no-build-isolation -vv ."
cwd = "patched/cppyy"

[feature.cppyy-dev.tasks.install-cppyy-from-upstream]
cmd = "pip install --no-deps --no-build-isolation -vv ."
cwd = "upstream/cppyy"

[feature.cppyy-dev-conda-forge.tasks.install]
depends-on = ["install-cppyy-from-patched"]

[feature.cppyy-dev-pypi.tasks.install]
depends-on = ["install-cppyy-from-patched"]

##############
# ACTIVATION #
##############
[activation.env]
MAKEFLAGS = "-j$(nproc || sysctl -n hw.ncpu)"
CMAKE_C_COMPILER_LAUNCHER = "ccache"
CMAKE_CXX_COMPILER_LAUNCHER = "ccache"