[workspace]
channels = ["conda-forge"]
name = "cppyy"
platforms = ["linux-64", "osx-64", "osx-arm64"]
version = "6.30.0"

[environments]
feedstock-dev = ["feedstock-dev"]
# TODO: Make these environments available, see README.md
# cppyy-cling-dev-builtin-llvm = [?]
# cppyy-cling-dev-conda-forge-llvm = [?]
# cppyy-cling-dev-local-builtin-llvm = [?]
# cppyy-cling-dev-local-conda-forge-llvm = [?]
# cppyy-backend-dev-local-builtin-llvm = [?]
# cppyy-backend-dev-conda-forge-llvm = [?]
# cppyy-backend-dev-conda-forge = [?]
# cppyy-backend-dev-pypi = [?]
# cpycppyy-dev-local-builtin-llvm = [?]
# cpycppyy-dev-conda-forge-llvm = [?]
# cpycppyy-dev-conda-forge = [?]
# cpycppyy-dev-pypi = [?]
# cppyy-dev-local-builtin-llvm = [?]
# cppyy-dev-conda-forge-llvm = [?]
# cppyy-dev-conda-forge = [?]
# cppyy-dev-pypi = [?]

[feature.feedstock-dev.dependencies]
conda-build = "*"
conda-smithy = "*"
conda-recipe-manager = "*"

[feature.cppyy-cling-dev.dependencies]
python = "*"
cxx-compiler = "*"
sed = "*"
cmake = "*"
findutils = "*"
make = "*"
libboost-headers = "*"
pip = "*"
setuptools = "*"
zlib = "*"

[feature.conda-forge-llvm.dependencies]
clangdev = { version="13.*", build="root_63004*" }

[feature.cppyy-backend-dev.dependencies]
python = "*"
cxx-compiler = "*"
pip = "*"
setuptools = "*"

[feature.conda-forge-cppyy-cling.dependencies]
cppyy-cling = "==6.30.0"

[activation.env]
MAKEFLAGS = "-j$(nproc || sysctl -n hw.ncpu)"
