[workspace]
channels = ["conda-forge"]
name = "cppyy"
platforms = ["linux-64"]
version = "6.30.0"

[dependencies]

[environments]
# Dependencies to build cppyy-cling with the maximum amount of opinionated conda-forge dependencies
cppyy-cling-conda-forge-dev = ["cppyy-cling-conda-forge-dev"]
# Dependencies to build cppyy-cling without any opinionated conda-forge dependencies
cppyy-cling-vanilla-dev = ["cppyy-cling-vanilla-dev"]
# Dependencies to build cppyy-backend with cppyy-cling from conda-forge
cppyy-backend-conda-forge-dev = ["cppyy-backend-conda-forge-dev"]
# Dependencies to build cppyy-backend with a local cppyy-cling
cppyy-backend-vanilla-dev = ["cppyy-backend-vanilla-dev", "cppyy-cling-vanilla-dev"]
# Dependencies to build CPyCppyy with cppyy-cling and cppyy-backend from conda-forge
cpycppyy-conda-forge-dev = ["cpycppyy-conda-forge-dev"]
# Dependencies to build CPyCppyy with a local cppyy-cling and cppyy-backend
cpycppyy-vanilla-dev = ["cpycppyy-vanilla-dev", "cppyy-backend-vanilla-dev"]
# Dependencies to build cppyy with only conda-forge dependencies
cppyy-conda-forge-dev = ["cppyy-conda-forge-dev"]
# Dependencies to build cppyy with a local cppyy-cling, CPyCppyy, and cppyy-backend
cppyy-vanilla-dev = ["cppyy-vanilla-dev", "cpycppyy-vanilla-dev"]

[feature.cppyy-cling-conda-forge-dev.dependencies]
[feature.cppyy-cling-vanilla-dev.dependencies]
[feature.cppyy-backend-conda-forge-dev.dependencies]
[feature.cppyy-backend-vanilla-dev.dependencies]
[feature.cpycppyy-conda-forge-dev.dependencies]
[feature.cpycppyy-vanilla-dev.dependencies]
[feature.cppyy-conda-forge-dev.dependencies]
[feature.cppyy-vanilla-dev.dependencies]
